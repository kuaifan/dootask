name: "App Internal"

# 内测出包：只产出 artifact，不创建 Release，也不上传 R2 / 商店。
# Android 使用正式签名（可覆盖安装正式包）；iOS 需另配内测 profiles（含测试设备 UDID），未配置时跳过：
#   IOS_INTERNAL_PROVISION_PROFILE_BASE64 / IOS_INTERNAL_SHARE_EXTENSION_PROVISION_PROFILE_BASE64
on:
  # TEMP: dev 分支验证 CI 出包，验证后删除
  push:
    branches: [dev]
    paths: ['.github/workflows/app-internal.yml', '.github/workflows/app-build.yml']
  workflow_dispatch:
    inputs:
      platform:
        description: 构建平台
        type: choice
        options: [all, android, ios]
        default: all
      ios_export_method:
        description: iOS 内测 profiles 类型（必须包含测试设备 UDID）
        type: choice
        options: [ad-hoc, development]
        default: ad-hoc

permissions:
  contents: read

concurrency:
  group: app-internal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/app-build.yml
    with:
      platform: ${{ inputs.platform || 'all' }}
      ios_export_method: ${{ inputs.ios_export_method || 'ad-hoc' }}
    secrets: inherit
